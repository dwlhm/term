name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        run: brew install sdl3

      - name: Build release binary
        run: make release

      - name: Build macOS app bundle
        run: make bundle

      - name: Build macOS disk image
        run: make dmg

      - name: Package release archives
        run: |
          tar -czf term-macos-arm64.tar.gz -C bin Term.app
          cd bin && zip -ry ../term-macos-arm64.zip Term.app && cd ..
          cp bin/Term.dmg .
          shasum -a 256 Term.dmg term-macos-arm64.tar.gz term-macos-arm64.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Term.dmg
            term-macos-arm64.tar.gz
            term-macos-arm64.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
