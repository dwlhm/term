name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Publish macOS Release
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      TERM_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        run: brew install sdl3 freetype harfbuzz

      - name: Static type check (Strict Style)
        run: make check

      - name: Run test suites & E2E
        run: make test

      - name: Build macOS app bundle
        run: make bundle

      - name: Verify bundled assets, frameworks & codesign
        run: |
          test -f bin/Term.app/Contents/Resources/fonts/MapleMono-NF-Regular.ttf
          test -f bin/Term.app/Contents/Resources/fonts/SymbolsNerdFontMono-Regular.ttf
          test -f bin/Term.app/Contents/Frameworks/libSDL3.0.dylib
          test -f bin/Term.app/Contents/Frameworks/libfreetype.6.dylib
          test -f bin/Term.app/Contents/Frameworks/libharfbuzz.0.dylib
          codesign --verify --deep --strict bin/Term.app

      - name: Build distribution packages (DMG, Portable ZIP, Tarball)
        run: |
          make dmg
          make portable
          tar -czf term-macos-arm64.tar.gz -C bin Term.app
          cp bin/Term.dmg .
          cp bin/Term-portable.zip .

      - name: Generate SHA256 Checksums
        run: |
          shasum -a 256 Term.dmg Term-portable.zip term-macos-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Rich Release Body
        run: |
          chmod +x scripts/generate_release_body.sh
          ./scripts/generate_release_body.sh "${{ github.ref_name }}" SHA256SUMS.txt RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            Term.dmg
            Term-portable.zip
            term-macos-arm64.tar.gz
            SHA256SUMS.txt
          draft: false
          prerelease: false
