name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup WGPU Native
        run: make setup-wgpu

      - name: Check code
        run: make check

      - name: Run test suites
        run: make test

      - name: Build release binary
        run: make release

      - name: Build macOS app bundle
        run: make bundle
