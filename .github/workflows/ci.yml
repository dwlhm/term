name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Verify macOS
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Odin Vendor Libraries (WGPU Native)
        run: |
          ODIN_ROOT=$(odin root)
          WGPU_DIR="$ODIN_ROOT/vendor/wgpu/lib/wgpu-macos-aarch64-release"
          mkdir -p "$WGPU_DIR"
          curl -sSL "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-macos-aarch64-release.zip" -o /tmp/wgpu.zip
          unzip -q -o /tmp/wgpu.zip -d "$WGPU_DIR"

      - name: Install System Dependencies
        run: brew install sdl3 freetype harfbuzz

      - name: Type check (Strict Style)
        run: make check

      - name: Run test suites & E2E
        run: make test

      - name: Build standalone application bundle
        run: make bundle

      - name: Verify bundled assets, frameworks & codesign
        run: |
          echo "==> Verifying bundled fonts..."
          test -f bin/Term.app/Contents/Resources/fonts/MapleMono-NF-Regular.ttf
          test -f bin/Term.app/Contents/Resources/fonts/SymbolsNerdFontMono-Regular.ttf
          
          echo "==> Verifying bundled dylibs in Frameworks/..."
          test -f bin/Term.app/Contents/Frameworks/libSDL3.0.dylib
          test -f bin/Term.app/Contents/Frameworks/libfreetype.6.dylib
          test -f bin/Term.app/Contents/Frameworks/libharfbuzz.0.dylib
          
          echo "==> Verifying ad-hoc code signature..."
          codesign --verify --deep --strict bin/Term.app

      - name: Package distribution artifacts (DMG & Portable ZIP)
        run: |
          make dmg
          make portable
          test -f bin/Term.dmg
          test -f bin/Term-portable.zip
