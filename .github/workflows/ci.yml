name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        run: brew install sdl3

      - name: Check code
        run: make check

      - name: Run test suites
        run: make test

      - name: Build release binary
        run: make release

      - name: Build MCP server binary
        run: make release-mcp

      - name: Build macOS app bundle
        run: make bundle

      - name: Verify DMG creation and bundled fonts
        run: |
          make dmg
          test -f bin/Term.app/Contents/Resources/fonts/MapleMono-NF-Regular.ttf
          test -f bin/Term.app/Contents/Resources/fonts/SymbolsNerdFontMono-Regular.ttf
